# goreleaser 发行配置(DESIGN.md §7.4 交付门:六目标全绿,CGO_ENABLED=0,体积 <40MB)。
version: 2
# 使用:安装 goreleaser 后 `goreleaser release` 或 `goreleaser release --snapshot`。
before:
  hooks:
    - go mod tidy
    - bash scripts/gen-extplugins.sh # M7 体积门:重建外部插件 gzip embed(漏则体积回归)
    - bash scripts/gen-web.sh # M7 Web UI:重建前端产物(漏则 go:embed 编译失败)
builds:
  - id: gah
    binary: gah
    main: ./cmd/gah
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64 # 视 pty 进度启用
archives:
  - id: gah-archive
    formats: [tar.gz, zip]
    files:
      - DESIGN.md
      - README.md
      - LICENSE
checksum:
  name_template: checksums.txt
# 与桌面壳流水线(release-desktop.yml)共用同一个 tag 的 Release:已存在则只追加产物
# (不覆盖正文、不报错);谁先跑完谁负责创建。draft=false 保证 releases/latest 立刻可用
# (updater 端点取 releases/latest/download/latest.json)。
release:
  draft: false
  mode: keep-existing
# 正文归属:由 release-desktop 的 merge job 用 GitHub 自动 notes 生成(两个 workflow 并发,
# 若 goreleaser 也写正文,谁后跑谁覆盖 → 结果不确定)。此处关掉自带 changelog,使最终正文
# 恒为 GitHub notes(本仓提交历史与 DESIGN.md §14.1 已是完整变更记录)。
changelog:
  disable: true
