# im-wechat profile:微信个人号 iLink Bot 远程控制形态(IM 线 P0-2b)。
# 用法:gah --profile im-wechat(或 -profile im-wechat;与 tui/web 互斥)。
# 注意:本 profile 不含 UI 插件(headless 无交互命令入口)——启动时未登录会自动把二维码
#   打印到 stderr(终端可扫),已登录则直接轮询。需要交互式重扫/查状态请用融合 profile:
#     gah --profile im-wechat-tui   (终端 TUI + 微信,/wechat login 二维码直显)
#     gah --profile im-wechat-web   (浏览器界面 + 微信,设置面板有 IM 通道状态)
# 微信向机器人发消息即远程操作宿主(普通文本 = agent 回合;/stop 取消)。
name: im-wechat
bundles:
  - base
  - im-wechat
patches: []
