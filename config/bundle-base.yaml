# seed-version: 23 # 样板版本:新增 base 能力条目(host-* 等)时 +1(23:新增 host-notices 提示通道),老用户自动升级(备份后覆盖)
# base bundle:对齐 dsh-base,一切功能皆插件的共享第一层。
# M1 阶段条目仅记录意图;对应插件工厂在 M2 base bundle 落地。
name: base
entries:
  - id: host-session-log
  - id: token-compress
    data:
      token_budget_chars: 40960 # M6.5 拆分:独立插件,投影字符预算,超限滚动摘要压缩(0 = 关闭)
  - id: host-tools
  - id: host-system-prompt
  - id: host-llm
  - id: llm-openai-compat
    data:
      base_url: https://api.deepseek.com/v1
  - id: llm-anthropic-compat
    data:
      base_url: https://api.anthropic.com/v1 # model=claude-* 时经模型前缀路由到本适配器
  - id: host-commands # 斜杠命令注册表(ctx.commands):插件命令自动进入 TUI 提示
  - id: host-internal-commands # B3 命令下沉:内部命令(thinking/model/provider/…/reload)宿主注册,web/TUI / 通用
  - id: host-agent-loop
  - id: policy-guard # M19 融合:policy-approval + policy-sandbox 统一策略插件(对外契约不变)
    data:
      approval: smart # 审批档位:open 放行 / smart 弹确认(默认) / strict 拒绝;运行期 /approval 切换
      sandbox: workspace-write # 沙箱档位:read-only / workspace-write(默认) / full-access;运行期 /sandbox 切换
      sync: true # 档位联动:open → 沙箱有效 full-access;strict → 有效 read-only;smart 各自独立
      # E-A 工具级审批(默认空 = 行为零变化):列出的工具每次调用都按上表档位裁决
      # (open 放行 / smart 弹确认 / strict 拒绝)。远程或破坏性副作用的工具应入此表,
      # 例如联网抓取、向外部系统写入。支持列表或逗号/空白分隔字符串。
      approval_tools: []
  - id: host-skills
  - id: host-plugin-manager
  - id: host-cwd-sessions
  - id: host-backup # M18 整体备份/恢复:ctx.backup + /backup 命令;备份目录 $GAH_HOME/backups(排除自身)
    data:
      keep: 5 # 自动备份轮转保留份数(backup_on_start 开时生效)
  - id: host-session-summary
    # F 组 F3 会话概述(LLM 总结):标题+一句话+主题词,落 $GAH_HOME/sessions/meta.json 缓存。
    # auto_summary 默认开(K3):仅「回合结束」触发,列表请求绝不触发模型;
    # 全局单飞 + 每会话 ≥min_interval_seconds 节流 + 输入预算 input_budget_bytes。
    data:
      auto_summary: true
      min_turns: 2
      stale_frames: 8
      min_interval_seconds: 600
      input_budget_bytes: 8192
  - id: host-docview
    # D 组文档预览:ctx.doc(sdk.DocService)——一个文档模型 + 三端呈现器(TUI/Web/headless);
    # 解析器(沙箱/逃逸/deny-list)+ 预算 + 内存缓存 + 格式探测;后续切片扩 md/docx/xlsx/pptx/pdf。
    data:
      max_input_mb: 50 # 源文件大小上限
      max_preview_kb: 1024 # 面板预览文本预算
      timeout_seconds: 10 # 单次抽取超时
      # D6-2 可选高保真档(默认关闭):本机装有 LibreOffice(soffice)时,把旧二进制
      # Office(.doc/.xls/.ppt)转 PDF 再抽取;产物落 $GAH_HOME/cache/doc/(7 天保留)。
      # external_converters: true
      # D6-1a/RST-1 可选光栅档(默认关闭):本机装有 poppler(pdftoppm)时,把 PDF 页渲染成
      # PNG(Web /api/doc/raster、gah doc --raster);产物落 $GAH_HOME/cache/doc/raster/。
      # external_raster: true
      # SELF-1 可选自包含光栅档(默认关闭):未装 poppler 的部署用内置 pdfium.wasm + wazero
      # 兜底(pdftoppm 可用时仍优先外部路径)。wasm 取件顺序:pdfium_wasm_path → 本地
      # $GAH_HOME/cache/pdfium/pdfium.wasm → 按 pdfium_wasm_url 下载(sha256 固定,一次性)。
      # selfcontained_raster: true
      # pdfium_wasm_path: /path/to/pdfium.wasm   # 随部署附带(离线)
      # pdfium_wasm_url: https://...             # 默认 pdfium-lib release 的 wasm.zip
  - id: host-usage-stats
    # 会话 token 统计(ctx.usageStats):状态栏显示上下文使用率/缓存命中率。
    # 上下文窗口解析链:data.context_window(统一覆盖)> data.model_windows(按模型名前缀覆盖,
    # 新模型/文档更新无需改代码)> 内置窗口表(claude 1M/200K、deepseek 128K、gemini 1M 等,
    # 发行版本基线);未知/空模型窗口=0,状态栏只显示使用量(不显示总量/百分比)。
  - id: host-jobs
  - id: host-schedule
    # NOND-W4 定时任务(ctx.schedule):5 字段 cron 计划,到点经既有回合入口(agentLoop→tools)
    # 跑一轮,仍受 policy 审批/沙箱裁决;无人值守运行 = 无确认通道 → 需审批的动作一律拒绝。
    # 计划落 $GAH_HOME/schedules/*.yaml;busy_wait_seconds = 有回合在跑时的等待上限(超时记 skipped)。
    data:
      busy_wait_seconds: 60
  - id: host-notices
    # NOND-N1 提示通道(ctx.notices):「需要人回来的时刻」的主动提示(后台任务终态/定时计划
    # 失败或跳过/回合报错),一人发多端收(Web toast / TUI 状态行 / 桌面壳系统通知)。
    # 提示不落盘、不进会话记录(瞬时信号,进程内环形缓冲;重连靠 List(sinceID) 回填)。
  - id: host-fanout
    enabled: true # M6.2 拆分:子代理编排宿主服务(ctx.fanout),tool-workflow 依赖
  - id: host-worktrees
    # S-P1-4 隔离运行:ctx.worktrees 受管 git worktree(Create/List/Remove + /worktree 命令)。
    # 子代理以此隔离出独立工作目录与分支(subagent 工具 isolate=worktree),改动不落主工作区;
    # worktree 落 $GAH_HOME/worktrees/(不污染用户仓库),非 git 仓库显式报错;默认保留 + 显式回收。
  - id: host-bridge
    # P1 方案B:默认启用,dir 缺省指向 home/plugins(首启随包释放 tool-basic)
    # M6.8 外部化:同时释放 tool-workflow/tool-mcp;回调通道 GAH_CB_ADDR 注入外部进程
    # 多 server:tool-mcp 经 GAH_MCP_COMMANDS(每行 name=command)接多个 MCP server;
    #   工具注册 mcp_<server>_<name>;GAH_MCP_COMMAND 单 server 不变(向后兼容)
    # 热更新(watch)默认开启:插件二进制/目录变化(fsnotify debounce)自动重载,运行中零重启生效
    enabled: true
    data:
      watch: true
  - id: mcp-bridge
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-mcp(GAH_MCP_COMMAND 单 / GAH_MCP_COMMANDS 多 server)
  - id: mcp-server
    enabled: false # MCP server 端(二期已交付):默认关闭,serve/headless 场景启用(gah 作 MCP server 被拉起)
  - id: acp-server
    enabled: false # S-P2-3:ACP agent 端(编辑器集成,如 Zed):默认关闭,gah acp / profile-acp 启用(需叠 confirm-fusion bundle)
  - id: tool-shell
    enabled: false # P1 外部化:内嵌实现停用,由 host-bridge 加载 home/plugins 外部进程
  - id: tool-files
    enabled: false # P1 外部化同上
  - id: tool-web
    enabled: false # P1 外部化同上
    # M6.14:包内含 web_fetch/web_search;web_search provider 经 data.provider 选(缺省 exa = 直连 Exa API,EXA_API_KEY;未知名显式失败)
  - id: tool-memory
    enabled: false # M10 外部化:memory(remember/list/recall/forget)由 host-bridge 加载 extplugins/tool-basic;内嵌双轨同 tool-files
  - id: tool-ask
    # P3 语义交互:ask_user_question 结构化提问(单选/多选/自由文本)。
    # 进程内装配(同 tool-auto-plan:提问通道需 ctx.question 运行期注入,外部进程不可达);
    # 问题经 ctx.question(host-confirm-fusion)广播 web/tui 渠道呈现,首答生效。
  - id: tool-todo
    enabled: false # M8 外部化:todo(create/start/complete/pend/delete/update/list/get)由 host-bridge 加载 extplugins/tool-basic;内嵌双轨同 tool-files
  - id: tool-doc
    # D 组文档预览:模型侧文档阅读三工具(read_document/doc_open/doc_list)。
    # 预算默认集对齐 dsh-document(maxInputBytes 50MiB / readLimit 2000 行 /
    # maxOutputBytes 50KiB / pdfMaxPages 100),可在此覆盖。
    data:
      read_limit: 2000
      max_output_kb: 50
      pdf_max_pages: 100
  - id: tool-auto-plan
    # M11:auto_plan(规划模式)与 todo 同属工具,但需进程内规则注入(ctx.systemPrompt AddSection,
    # 外部进程无法注入)→ 装配进宿主(host-skills 同款),不进 tool-basic。
    # data.enable_rule:规则注入开关(默认开;与 AGENTS.md 全局“操作确认”规则重复冗余时可关)
    data:
      enable_rule: true
  - id: tool-session-search
    enabled: false # S-P2-5 外部化:session_search(跨会话检索,只读)由 host-bridge 加载 extplugins/tool-basic;内嵌双轨同 tool-files
  - id: tool-subagent
    enabled: false # M9.1 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-subagent(独立进程,回调宿主 fanout)
  - id: tool-workflow
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-workflow(宿主回调通道驱动)

