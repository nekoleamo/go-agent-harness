# seed-version: 12 # 样板版本:新增 base 能力条目(host-* 等)时 +1,老用户自动升级(备份后覆盖)
# base bundle:对齐 dsh-base,一切功能皆插件的共享第一层。
# M1 阶段条目仅记录意图;对应插件工厂在 M2 base bundle 落地。
name: base
entries:
  - id: host-session-log
  - id: token-compress
    data:
      token_budget_chars: 40960 # M6.5 拆分:独立插件,投影字符预算,超限滚动摘要压缩(0 = 关闭)
  - id: host-tools
  - id: host-system-prompt
  - id: host-llm
  - id: llm-openai-compat
    data:
      base_url: https://api.deepseek.com/v1
  - id: llm-anthropic-compat
    data:
      base_url: https://api.anthropic.com/v1 # model=claude-* 时经模型前缀路由到本适配器
  - id: host-commands # 斜杠命令注册表(ctx.commands):插件命令自动进入 TUI 提示
  - id: host-internal-commands # B3 命令下沉:内部命令(thinking/model/provider/…/reload)宿主注册,web/TUI / 通用
  - id: host-agent-loop
  - id: policy-guard # M19 融合:policy-approval + policy-sandbox 统一策略插件(对外契约不变)
    data:
      approval: smart # 审批档位:open 放行 / smart 弹确认(默认) / strict 拒绝;运行期 /approval 切换
      sandbox: workspace-write # 沙箱档位:read-only / workspace-write(默认) / full-access;运行期 /sandbox 切换
      sync: true # 档位联动:open → 沙箱有效 full-access;strict → 有效 read-only;smart 各自独立
  - id: host-skills
  - id: host-plugin-manager
  - id: host-cwd-sessions
  - id: host-backup # M18 整体备份/恢复:ctx.backup + /backup 命令;备份目录 $GAH_HOME/backups(排除自身)
    data:
      keep: 5 # 自动备份轮转保留份数(backup_on_start 开时生效)
  - id: host-usage-stats
    # 会话 token 统计(ctx.usageStats):状态栏显示上下文使用率/缓存命中率。
    # 上下文窗口解析链:data.context_window(统一覆盖)> data.model_windows(按模型名前缀覆盖,
    # 新模型/文档更新无需改代码)> 内置窗口表(claude 1M/200K、deepseek 128K、gemini 1M 等,
    # 发行版本基线);未知/空模型窗口=0,状态栏只显示使用量(不显示总量/百分比)。
  - id: host-jobs
  - id: host-fanout
    enabled: true # M6.2 拆分:子代理编排宿主服务(ctx.fanout),tool-workflow 依赖
  - id: host-bridge
    # P1 方案B:默认启用,dir 缺省指向 home/plugins(首启随包释放 tool-basic)
    # M6.8 外部化:同时释放 tool-workflow/tool-mcp;回调通道 GAH_CB_ADDR 注入外部进程
    # 多 server:tool-mcp 经 GAH_MCP_COMMANDS(每行 name=command)接多个 MCP server;
    #   工具注册 mcp_<server>_<name>;GAH_MCP_COMMAND 单 server 不变(向后兼容)
    # 热更新(watch)默认开启:插件二进制/目录变化(fsnotify debounce)自动重载,运行中零重启生效
    enabled: true
    data:
      watch: true
  - id: mcp-bridge
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-mcp(GAH_MCP_COMMAND 单 / GAH_MCP_COMMANDS 多 server)
  - id: mcp-server
    enabled: false # MCP server 端(二期已交付):默认关闭,serve/headless 场景启用(gah 作 MCP server 被拉起)
  - id: tool-shell
    enabled: false # P1 外部化:内嵌实现停用,由 host-bridge 加载 home/plugins 外部进程
  - id: tool-files
    enabled: false # P1 外部化同上
  - id: tool-web
    enabled: false # P1 外部化同上
    # M6.14:包内含 web_fetch/web_search;web_search provider 经 data.provider 选(缺省 exa = 直连 Exa API,EXA_API_KEY;未知名显式失败)
  - id: tool-memory
    enabled: false # M10 外部化:memory(remember/list/recall/forget)由 host-bridge 加载 extplugins/tool-basic;内嵌双轨同 tool-files
  - id: tool-todo
    enabled: false # M8 外部化:todo(create/start/complete/pend/delete/update/list/get)由 host-bridge 加载 extplugins/tool-basic;内嵌双轨同 tool-files
  - id: tool-auto-plan
    # M11:auto_plan(规划模式)与 todo 同属工具,但需进程内规则注入(ctx.systemPrompt AddSection,
    # 外部进程无法注入)→ 装配进宿主(host-skills 同款),不进 tool-basic。
    # data.enable_rule:规则注入开关(默认开;与 AGENTS.md 全局“操作确认”规则重复冗余时可关)
    data:
      enable_rule: true
  - id: tool-subagent
    enabled: false # M9.1 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-subagent(独立进程,回调宿主 fanout)
  - id: tool-workflow
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-workflow(宿主回调通道驱动)

