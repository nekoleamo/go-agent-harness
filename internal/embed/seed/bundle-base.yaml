# base bundle:对齐 dsh-base,一切功能皆插件的共享第一层。
# M1 阶段条目仅记录意图;对应插件工厂在 M2 base bundle 落地。
name: base
entries:
  - id: host-session-log
    data:
      token_budget_chars: 40960 # M6.5:投影字符预算,超限滚动摘要压缩(0 = 关闭)
  - id: host-tools
  - id: host-system-prompt
  - id: host-llm
  - id: llm-openai-compat
    data:
      base_url: https://api.deepseek.com/v1
  - id: host-agent-loop
  - id: policy-sandbox
    data:
      mode: workspace-write
  - id: policy-approval
  - id: host-skills
  - id: host-plugin-manager
  - id: host-cwd-sessions
  - id: host-jobs
  - id: host-bridge
    # P1 方案B:默认启用,dir 缺省指向 home/plugins(首启随包释放 tool-basic)
    enabled: true
  - id: mcp-bridge
    enabled: false # MCP client 桥(M5.5):默认关闭;data.command 指定 MCP server 启动命令
  - id: tool-shell
    enabled: false # P1 外部化:内嵌实现停用,由 host-bridge 加载 home/plugins 外部进程
  - id: tool-files
    enabled: false # P1 外部化同上
  - id: tool-web
    enabled: false # P1 外部化同上

