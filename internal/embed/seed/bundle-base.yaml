# base bundle:对齐 dsh-base,一切功能皆插件的共享第一层。
# M1 阶段条目仅记录意图;对应插件工厂在 M2 base bundle 落地。
name: base
entries:
  - id: host-session-log
  - id: token-compress
    data:
      token_budget_chars: 40960 # M6.5 拆分:独立插件,投影字符预算,超限滚动摘要压缩(0 = 关闭)
  - id: host-tools
  - id: host-system-prompt
  - id: host-llm
  - id: llm-openai-compat
    data:
      base_url: https://api.deepseek.com/v1
  - id: llm-anthropic-compat
    data:
      base_url: https://api.anthropic.com/v1 # model=claude-* 时经模型前缀路由到本适配器
  - id: host-agent-loop
  - id: policy-sandbox
    data:
      mode: workspace-write
  - id: policy-approval
  - id: host-skills
  - id: host-plugin-manager
  - id: host-cwd-sessions
  - id: host-jobs
  - id: host-fanout
    enabled: true # M6.2 拆分:子代理编排宿主服务(ctx.fanout),tool-workflow 依赖
  - id: host-bridge
    # P1 方案B:默认启用,dir 缺省指向 home/plugins(首启随包释放 tool-basic)
    # M6.8 外部化:同时释放 tool-workflow/tool-mcp;回调通道 GAH_CB_ADDR 注入外部进程
    enabled: true
  - id: mcp-bridge
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-mcp(GAH_MCP_COMMAND 指定 MCP server)
  - id: mcp-server
    enabled: false # MCP server 端(二期已交付):默认关闭,serve/headless 场景启用(gah 作 MCP server 被拉起)
  - id: tool-shell
    enabled: false # P1 外部化:内嵌实现停用,由 host-bridge 加载 home/plugins 外部进程
  - id: tool-files
    enabled: false # P1 外部化同上
  - id: tool-web
    enabled: false # P1 外部化同上
  - id: tool-workflow
    enabled: false # M6.8 外部化:内嵌实现停用,由 host-bridge 加载 extplugins/tool-workflow(宿主回调通道驱动)

