# im-wechat-tui profile:微信远程控制 + 终端 TUI 并存(P3 三端融合,终端形态)。
# 用途:在终端里执行 /wechat login 扫码(ASCII 二维码直显,终端里最好扫)、/wechat status 查状态;
#   同时微信侧远程操作宿主(回合/命令/审批)。
# host-confirm-fusion 统一 ctx.confirm:危险操作确认可在终端弹层或微信 y/n 任一处应答。
# 用法:gah --profile im-wechat-tui
name: im-wechat-tui
bundles:
  - base
  - confirm-fusion
  - tui
  - im-wechat
patches: []
