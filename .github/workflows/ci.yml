# CI:go vet + go test -race 全绿 + 体积门 + 裸机冒烟(对齐 AGENTS.md 与 DESIGN.md §15)。
# 体积门:阈值与实现单一事实源 = scripts/size-check.sh(E-C 治理件;按实测两轮重定基 ——
# 2026-10-11 46/30、2026-11-14 48/32 MiB;构成 = 基线 + 本平台 extplugins gz embed,
# 归因与降体路径由脚本头打印)。
name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: 重建外部插件(gzip embed)
        run: bash scripts/gen-extplugins.sh
      - name: 重建前端产物(M7:vue-tsc 类型检查 + vite build → web/dist,漏则 go:embed 编译失败)
        run: bash scripts/gen-web.sh
      - name: 前端逻辑单测(node 内置运行器,零新增依赖;E-E)
        run: cd web-src && npm test
      - name: go vet(sdk 为独立 module,go.work 下根目录 ./... 不含它,须单独跑)
        run: |
          go vet ./...
          (cd sdk && go vet ./...)
      - name: staticcheck(静态分析;版本固定保证本地/CI 一致)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          "$(go env GOPATH)/bin/staticcheck" ./...
          (cd sdk && "$(go env GOPATH)/bin/staticcheck" ./...)
      - name: go test -race(含覆盖率 profile,供下一步复用;sdk module 单独跑)
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          (cd sdk && go test -race -coverprofile=../sdk-coverage.out -covermode=atomic ./...)
      - name: 覆盖率门(逐包棘轮 + 全局下限;阈值只在 scripts/coverage-check.sh)
        run: bash scripts/coverage-check.sh coverage.out sdk-coverage.out
      - name: 交叉编译矩阵(五目标+体积门+平台匹配)
        run: |
          # 体积门:五目标交叉编译 + 二进制/gz 双阈值(阈值只在 scripts/size-check.sh);
          # embed 经 build-tag 只嵌本平台外部插件(产物平台匹配由下方单测在 linux/amd64 上校验,
          # 其余目标由 go build 能否取到对应 embed 目录保证)。
          bash scripts/size-check.sh --all
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /tmp/gah-linux-amd64 ./cmd/gah
          go test ./internal/embed/ -run TestExtPluginsMatchPlatform -count=1
          cp /tmp/gah-linux-amd64 ./gah # 供后续裸机冒烟
      - name: 发行流水线冒烟(goreleaser snapshot 全链路)
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --snapshot --clean
      - name: snapshot 产物抽查(五目标归档 + linux/amd64 主包架构)
        run: |
          # 冒烟覆盖:before hook(go mod tidy + 重生成插件)→ 五目标交叉构建 →
          # 归档/checksum;插件平台匹配已由 gen-extplugins.sh 内 assert_arch 与单测护栏。
          for t in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64; do
            ls dist/*${t}*.tar.gz >/dev/null || { echo "缺少 ${t} 归档"; exit 1; }
          done
          mkdir -p /tmp/dist-check && tar -xzf dist/*linux_amd64*.tar.gz -C /tmp/dist-check
          find /tmp/dist-check -name gah -type f -exec head -c 4 {} \; | od -An -tx1 | grep -q '7f 45 4c 46' \
            || { echo "linux/amd64 主包非 ELF"; exit 1; }
          echo "发行流水线冒烟 OK"
      - name: 裸机冒烟(env -i 纯净环境启动)
        run: |
          env -i HOME="$(mktemp -d)" PATH="$PATH" ./gah --profile headless --ephemeral --dump-config >/dev/null
          echo "裸机启动 OK"
      - name: 裸机真实回合(首启释放+外部插件全装配+P3 软降级护栏)
        run: |
          # 真实首启路径:GAH_HOME 贯通临时 home → 外部插件三件套释放并装配;
          # tool-mcp 无 GAH_MCP_COMMAND 经 P3 软降级跳过(仅 ERROR 日志);
          # headless 默认 llm-mock(无外网)跑完整回合(调 tool-basic shell)。
          env -i HOME="$(mktemp -d)" PATH="$PATH" ./gah --profile headless --ephemeral -input "hi" >/dev/null
          echo "headless 真实回合 OK"
      - name: 全库 -race 计时回归护栏(M16 T3:改动后首跑 ≤150s;本地实测 74s)
        run: |
          start=$(date +%s)
          go test ./... -count=1 -race
          code=$?
          end=$(date +%s)
          echo "full race first-run: $((end-start))s"
          [ $code -eq 0 ] || exit $code
          [ $((end-start)) -le 150 ] || { echo "计时回归:首次全库 -race 超 150s(此前基线 74s)"; exit 1; }

      - name: WebSocket 通道冒烟(M7.3:WS 事件载体 + 会话帧)
        run: |
          # 起 web 形态(mock 默认;ephemeral 临时 home)后经 go run 冒烟脚本:
          # POST input 制造事件 → WS 握手(Accept 官方向量)→ 断言收到 user/message 帧。
          env -i HOME="$(mktemp -d)" PATH="$PATH" GAH_WEB_OPEN=0 ./gah --profile web --ephemeral &
          GAH_PID=$!
          sleep 2
          go run ./scripts/ws-smoke.go
          kill $GAH_PID 2>/dev/null || true
          echo "WS 通道冒烟 OK"

  # Windows 平台自动化。此前 ci.yml 仅 ubuntu-latest,Windows 零覆盖 —— 而 Windows 恰是
  # 平台分支最多的目标(无内核级沙箱 / POSIX shell 经 Git for Windows / 无 SIGTERM)。
  # 覆盖 README 列明的 Windows 特有机制:posix shell 探测(sdk/shellpath.go)、
  # MSYS_NO_PATHCONV、无内核沙箱的软降级、优雅停机 POST /api/shutdown。
  # 刻意不跑:覆盖率门与体积门(阈值按 linux/amd64 基线定,平台分支差异会误报)。
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: 重建外部插件(gzip embed;发行矩阵含 windows/amd64)
        run: bash scripts/gen-extplugins.sh
      - name: 重建前端产物(vue-tsc + vite build → web/dist,漏则 go:embed 编译失败)
        run: bash scripts/gen-web.sh
      - name: go vet(sdk 为独立 module,须单独跑)
        run: |
          go vet ./...
          (cd sdk && go vet ./...)
      - name: go test(-race 需 cgo/gcc,有则跑,无则降级并明示)
        run: |
          if command -v gcc >/dev/null 2>&1; then
            echo "gcc 可用 → 全库 -race"
            go test -race ./...
            (cd sdk && go test -race ./...)
          else
            echo "无 gcc → 降级为无 -race(race detector 在 windows 需 cgo)"
            go test ./...
            (cd sdk && go test ./...)
          fi
      - name: 构建 windows/amd64 主包
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o gah.exe ./cmd/gah
      - name: 裸机冒烟(env -i 纯净环境启动)
        run: |
          # 不用 env -i:Windows 原生程序依赖 SystemRoot/TEMP 等系统变量,清空环境会引发难查的路径失败;
          # runner 本身无 GAH_* 污染,只隔离 HOME 即可(“纯净环境启动”的完整验证由 ubuntu job 承担)。
          HOME="$(mktemp -d)" ./gah.exe --profile headless --ephemeral --dump-config >/dev/null
          echo "Windows 裸机启动 OK"
      - name: 裸机真实回合(覆盖 tool-basic shell → Git for Windows 的 sh 探测)
        run: |
          HOME="$(mktemp -d)" ./gah.exe --profile headless --ephemeral -input "hi" >/dev/null 2>win-round.log
          echo "Windows headless 真实回合 OK"
          echo "--- 无内核级沙箱软降级观测(README:无能力平台 → 一次性 stderr 告警 + 不施加包装)---"
          grep -i "sandbox" win-round.log || echo "(本轮 stderr 未匹配 sandbox 字样,仅作观测不做断言)"
      - name: WebSocket 通道冒烟 + 优雅停机(POST /api/shutdown;Windows 无 SIGTERM)
        run: |
          # Windows 无法靠 SIGTERM 停机,停机通道即 POST /api/shutdown —— 此处同时验证 WS 事件载体
          # 与优雅停机:先冒烟收发,再走 shutdown 断言进程确实自行退出(而非被 kill)。
          HOME="$(mktemp -d)" GAH_WEB_OPEN=0 ./gah.exe --profile web --ephemeral &
          GAH_PID=$!
          sleep 3
          go run ./scripts/ws-smoke.go
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:2233/api/shutdown)
          echo "shutdown HTTP $code"
          for _ in $(seq 1 10); do kill -0 $GAH_PID 2>/dev/null || break; sleep 1; done
          if kill -0 $GAH_PID 2>/dev/null; then
            echo "::error::优雅停机后进程仍在(DisposeAll 未走完或 shutdown 通道未生效)"
            kill $GAH_PID 2>/dev/null || true
            exit 1
          fi
          echo "WS 通道 + 优雅停机 OK"
