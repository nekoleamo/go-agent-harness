# 桌面壳零成本发行(tag v* 触发):无 Apple/Windows 代码签名(mac 首启右键打开,
# win SmartScreen 放行;见 docs/RELEASE.md);updater ed25519 自持签名(secret:
# TAURI_SIGNING_PRIVATE_KEY,由 tauri signer generate 生成,私钥勿入库)。
# 流程:mac aarch64 + win x86_64 两 job 各跑 publish-desktop.sh → artifact 汇总 →
# merge latest.json → softprops 上传安装包 + latest.json 到该 tag 的 GitHub Release。
# 说明:mac x86_64(老 Intel)暂未入矩阵,需要时加 macos-13 或交叉 job。
name: release-desktop
# 上传 Release 需要写权限(repo 默认 token 只读 → 实测 403 Resource not accessible by integration)
permissions:
  contents: write
on:
  push:
    tags: ["v*"]
  # 手动运行两种用法:
  #  ① 什么都不填 = 打包预演:两个平台 job 照跑,产物进 artifact,不碰 Release(首个 tag 前验证用)
  #  ② tag=vX.Y.Z(+ 可选 run_id)= 补发:只跑 merge job,把安装包/latest.json 传到该 tag 的 Release;
  #     给了 run_id 就复用那次运行的打包 artifact(actions/download-artifact 的 run-id),不重新打包
  #     —— 用于「tag 已推、平台 job 已绿、只有 merge 上传失败」这种场景,避免移动/重推已消费的 tag
  workflow_dispatch:
    inputs:
      tag:
        description: "补发目标 tag(如 v0.1.0);留空则只做打包预演"
        required: false
        type: string
      run_id:
        description: "复用哪次运行的打包 artifact(留空则本次重新打包)"
        required: false
        type: string
      mirror_base:
        description: "国内加速:只改写 latest.json 的下载 URL 前缀(如 https://gh-proxy.com/;取 none 还原)。需同时给 tag"
        required: false
        type: string

jobs:
  desktop-mac-aarch64:
    # mirror_base 模式 = 只改写线上 latest.json,不与打包/发布路径并发
    # (否则 merge job 会把直链表重传上去,把换源结果覆盖掉)
    if: inputs.run_id == '' && inputs.mirror_base == ''
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe --tags 需全历史
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: 重建外部插件与前端产物(sidecar go build 依赖两者:embed extplugins + web/dist)
        run: |
          bash scripts/gen-extplugins.sh
          bash scripts/gen-web.sh
      - name: 桌面发行(aarch64)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/publish-desktop.sh darwin-aarch64
      # 上传前自校验:签名必须是用仓库登记的那把钥匙签的、包内版本必须与 latest.json 一致。
      # 这两类错上传后**只能靠人发现**(更新器拿到 404 会显示成「暂无可用更新」),故前移到本地检查。
      - name: 校验本平台产物(签名 + 包内版本)
        run: node scripts/verify-release.mjs --local dist-desktop --platform darwin-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-mac-aarch64
          path: dist-desktop
          if-no-files-found: error

  desktop-win-x86_64:
    if: inputs.run_id == '' && inputs.mirror_base == ''
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: 重建外部插件与前端产物(sidecar go build 依赖两者)
        run: |
          bash scripts/gen-extplugins.sh
          bash scripts/gen-web.sh
      - name: 桌面发行(win x86_64;NSIS 由 tauri-cli 自动拉取)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bash scripts/publish-desktop.sh windows-x86_64
      # 上传前自校验(同 mac 侧;Windows 无 plutil,包内版本自查自动跳过)
      - name: 校验本平台产物(签名)
        run: node scripts/verify-release.mjs --local dist-desktop --platform windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: dist-desktop-win-x86_64
          path: dist-desktop
          if-no-files-found: error

  merge-upload:
    needs: [desktop-mac-aarch64, desktop-win-x86_64]
    # tag 推送、或手动给了 tag 输入时才上传 Release(纯打包预演不碰 Release);平台 job 被跳过时
    # 用 !cancelled() 放行本 job(needs 结果为 skipped)
    if: ${{ !cancelled() && inputs.mirror_base == '' && (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 补发(带了 tag 输入)时取**默认分支**的脚本:publish-desktop.sh / verify-release.mjs 的修复
          # 应当立即生效,而不是让已消费的 tag 把旧脚本一起搬回来(2026-09-22 实测:tag 上的旧脚本
          # 让补发回查误报);tag push 触发时仍取该 tag 自身。tags 由 fetch-depth: 0 一并取到,
          # 下面的「发布正文 = tag 注解」步照旧可用。
          ref: ${{ (inputs.tag != '' && github.event.repository.default_branch) || github.ref }}
      - uses: actions/download-artifact@v4
        if: inputs.run_id == ''
        with:
          pattern: dist-desktop-*
          merge-multiple: true
          path: dist-desktop
      - uses: actions/download-artifact@v4
        if: inputs.run_id != ''
        with:
          pattern: dist-desktop-*
          merge-multiple: true
          path: dist-desktop
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 安装 jq 并合并 latest.json
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null
          bash scripts/publish-desktop.sh merge
      - name: 发布正文 = tag 注解(注解为空则回退 changelog 链接)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist-desktop
          git tag -l --format='%(contents)' "$TAG" > dist-desktop/release-body.md
          if [ ! -s dist-desktop/release-body.md ]; then
            printf '**Full Changelog**: https://github.com/%s/commits/%s\n' \
              "$GITHUB_REPOSITORY" "$TAG" > dist-desktop/release-body.md
          fi
      - name: 上传 Release(安装包 + latest.json)
        uses: softprops/action-gh-release@v2
        with:
          # dispatch 补发时 github.ref 是分支,必须显式给 tag
          tag_name: ${{ inputs.tag || github.ref_name }}
          # *-setup.exe.zip 是 Tauri 的 zip 变体;当前版本产的是直接签名的 -setup.exe,
          # 该 pattern 不匹配只会打一行 warning(不失败),保留以兼容未来改名
          files: |
            dist-desktop/latest.json
            dist-desktop/**/*.app.tar.gz
            dist-desktop/**/*.dmg
            dist-desktop/**/*-setup.exe
            dist-desktop/**/*-setup.exe.zip
          draft: false
          prerelease: false
          # 正文来自 tag 注解(人工写的发行说明);不用 GitHub 自动 notes —— 两个 workflow 并发时
          # 正文归属必须唯一(见 .goreleaser.yaml changelog.disable 的说明)
          body_path: dist-desktop/release-body.md
      # 发布后回查线上清单:平台矩阵是否**完整**(缺一个平台 = 该平台更新器拿到 404,而壳里
      # 那句「暂无可用更新」与「已是最新」长得一样)、签名是否出自登记的公钥、版本号是否可解析。
      # 这一步是「发布漏了平台」这类静默失效的唯一自动出口。
      - name: 回查线上 latest.json(矩阵完整 + 密钥指纹)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          # 桌面发行只出 mac-aarch64 + win-x64;脚本默认矩阵含 linux 三目标(那是 CLI 侧),
          # 不声明就会把「linux 不在桌面清单里」判成失败(2026-09-22 实测)。
          GAH_RELEASE_PLATFORMS: darwin-aarch64,windows-x86_64
        run: node scripts/verify-release.mjs --tag "$TAG" --skip-artifacts

  # 国内加速:改写 latest.json 的下载 URL 前缀(不重建包、不动签名、不移动 tag)。
  #   用法:workflow_dispatch { tag: vX.Y.Z, mirror_base: https://gh-proxy.com/ };填 none 还原直链。
  # 原理:updater 的 ed25519 签名只对**文件内容**验签,URL 不参与 ⇒ 换源不降低安全强度,
  #   而且对**存量客户端**立即生效(不需重编重发)。GitHub Release 仍是唯一事实源,
  #   这里只替换同一个 asset,不动 tag、不动包。
  # 把桌面产物与代码快照镜像到 Gitee(国内直连;零成本自控镜像,不依赖第三方代理)。
  # GitHub 仍是唯一事实源;本 job 失败不影响主发布,但会在 run 里变红以示可见。
  # 需要 secret:GITEE_TOKEN(Gitee 私人令牌,projects 权限);未配置则告警跳过。
  # 回退到直链:workflow_dispatch { tag, mirror_base: none }
  mirror-gitee:
    needs: [merge-upload]
    if: ${{ !cancelled() && inputs.mirror_base == '' && inputs.tag != '' && needs.merge-upload.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPO: ${{ vars.GITEE_REPO || 'null_593_5354/go-agent-harness' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 未配置 GITEE_TOKEN 则跳过
        id: gate
        run: |
          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::warning::GITEE_TOKEN 未配置,跳过 Gitee 镜像(发布不受影响)"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v4
      - name: 取回本次 Release 的产物与表
        if: steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          mkdir -p dist-desktop/up
          gh release download "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" \
            -p '*.dmg' -p '*-setup.exe' -p '*.app.tar.gz' -p 'latest.json' -D dist-desktop/up
          ls -l dist-desktop/up
      - name: 上传产物到 Gitee Release(同名附件先删后传,幂等)
        if: steps.gate.outputs.skip != '1'
        run: bash scripts/mirror-gitee.sh upload "${{ inputs.tag }}" dist-desktop/up
      - name: 代码快照 + Gitee 版表同步到 Gitee 仓库
        if: steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          # 上一步已生成 dist-desktop/gitee/latest.json(下载地址全部指向 Gitee 直链),
          # 把它作为仓库根的 latest.json 一起提交 —— 客户端从 raw 通道读的就是这份表。
          GAH_EXTRA_FILES=dist-desktop/gitee/latest.json:latest.json bash scripts/sync-gitee.sh
      - name: 回查 Gitee 版表(匿名 raw;CDN 缓存 60 秒,所以重试)
        if: steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          url="https://gitee.com/${GITEE_REPO}/raw/master/latest.json"
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 30 "$url" || true)"
            if printf '%s' "$body" | jq -e --arg b "https://gitee.com/${GITEE_REPO}/releases/download/" \
                 '[.platforms[].url | startswith($b)] | all' >/dev/null 2>&1; then
              echo "Gitee 表已生效(第 $i 次尝试)"
              exit 0
            fi
            echo "尚未生效(CDN 缓存 60 秒),15 秒后重试…"
            sleep 15
          done
          echo "::error::Gitee raw 表未在预期时间内生效"
          exit 1
      - name: GitHub 表换到加速前缀(兼容存量 0.1.5)并回传
        if: steps.gate.outputs.skip != '1'
        run: |
          set -euo pipefail
          cp dist-desktop/up/latest.json dist-desktop/latest.json
          bash scripts/publish-desktop.sh rewrite-url https://gh-proxy.com/
          gh release upload "${{ inputs.tag }}" dist-desktop/latest.json -R "$GITHUB_REPOSITORY" --clobber
          rm -rf /tmp/live && mkdir -p /tmp/live
          gh release download "${{ inputs.tag }}" -p latest.json -D /tmp/live --clobber
          jq -e --arg b "https://gh-proxy.com/" '[.platforms[].url | startswith($b)] | all' /tmp/live/latest.json >/dev/null
          diff <(jq -S '.platforms | map_values(.signature)' dist-desktop/up/latest.json) \
               <(jq -S '.platforms | map_values(.signature)' /tmp/live/latest.json)
          echo "线上 latest.json 已指向加速前缀(存量 0.1.5 走这跳),签名逐平台未变"

  rewrite-mirror:
    if: ${{ inputs.tag != '' && inputs.mirror_base != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 merge job:脚本修复应立即生效,而不是被已消费的 tag 上的旧副本盖回去
          ref: ${{ github.event.repository.default_branch }}
      - name: 取回线上 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq >/dev/null
          mkdir -p dist-desktop
          gh release download "$TAG" -p latest.json -D dist-desktop --clobber
          jq -r '"当前版本 \(.version);平台 \(.platforms|keys|join(","))"' dist-desktop/latest.json
      - name: 改写下载前缀(内部自检:签名逐平台未被改动)
        env:
          MIRROR: ${{ inputs.mirror_base }}
        run: bash scripts/publish-desktop.sh rewrite-url "$MIRROR"
      - name: 重传同名 asset(GitHub 仍是唯一事实源)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" dist-desktop/latest.json --clobber
      - name: 回查线上表(版本 + 平台集合 + 签名 + 前缀)
        env:
          TAG: ${{ inputs.tag }}
          MIRROR: ${{ inputs.mirror_base }}
        run: |
          for i in 1 2 3 4 5; do
            if got="$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/latest.json")"; then break; fi
            sleep 5
          done
          [ -n "${got:-}" ] || { echo "线上表取不回来"; exit 1; }
          echo "$got" | jq .
          echo "$got" | jq -e '.version and (.platforms | length > 0) and ([.platforms[].signature | length > 0] | all)' >/dev/null \
            || { echo "线上表结构不完整"; exit 1; }
          if [ "$MIRROR" != "none" ] && [ "$MIRROR" != "github" ]; then
            echo "$got" | jq -e --arg m "$MIRROR" '[.platforms[].url | startswith($m)] | all' >/dev/null \
              || { echo "线上表 URL 前缀不是 $MIRROR"; exit 1; }
          fi
