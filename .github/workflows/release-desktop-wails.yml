# Go + Wails v3 桌面壳发行(旧 Tauri 链已于 2026-10-29 删除,这里是唯一的桌面发行流水线)。
#
# 触发:打 `v*` tag 自动发布(与 release-cli 共用同一个 Release),或 workflow_dispatch 手动。
# 2026-10-30 起**统一到 `v*`**:旧链删除后不再有「两条链抢同一个 tag」的问题,
# 再分两个前缀只会让「桌面版没跟上」变成一件静默的事(CLI 发了、桌面没发)。
#
# 差异(相对 Tauri 链):
#   - 产物:mac `.app.zip`(+ 可选 dmg)/ win 单 exe zip(updater 只吃「唯一顶层条目的 zip」)
#   - 清单:desktop-latest.json(自持格式,签名对象 = 产物 sha256 摘要)
#   - 密钥:GAH_DESKTOP_UPDATE_KEY(ed25519 私钥 hex);公钥经 -ldflags 注入壳
#   - windows 目标纯 Go(无 cgo),darwin 必须 cgo → 各自的 runner
#
# 必填 secrets:
#   GAH_DESKTOP_UPDATE_KEY      签名私钥(hex,由 desktopman keygen 生成)
#   GAH_DESKTOP_UPDATE_PUBKEY   对应公钥(hex,注入壳内置信任根)
name: release-desktop-wails

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发行/补发的 tag(留空则用当前 ref)"
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # 内嵌 web/dist 与 extplugins 都要现成产物,否则 sidecar 编不出来(与 Tauri 链同前置)。
  CGO_ENABLED: '0'

jobs:
  darwin-aarch64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: 外部插件与前端产物(go:embed 前置)
        run: |
          bash scripts/gen-extplugins.sh
          bash scripts/gen-web.sh
      - name: 构建 + 打包 + 签名 + 清单
        env:
          GAH_DESKTOP_UPDATE_KEY: ${{ secrets.GAH_DESKTOP_UPDATE_KEY }}
          GAH_DESKTOP_UPDATE_PUBKEY: ${{ secrets.GAH_DESKTOP_UPDATE_PUBKEY }}
          # 下载地址用**本 tag 的直链**,不用 releases/latest/download:
          # `latest` 不包含预发布(semver 带后缀的 tag 会被 GitHub 标成 prerelease),
          # 预告版发出去后那个地址会 404 或指到上一版 —— 2026-10-30 发 0.8.0-preview 时踩过。
          GAH_DESKTOP_URL_BASE: https://github.com/nekoleamo/go-agent-harness/releases/download/${{ inputs.tag || github.ref_name }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          # 私钥从 secret 落到临时文件(脚本按路径读),退出即随 runner 销毁。
          umask 077
          printf '%s\n' "$GAH_DESKTOP_UPDATE_KEY" > "$RUNNER_TEMP/update.key"
          export GAH_DESKTOP_UPDATE_KEY="$RUNNER_TEMP/update.key"
          export RELEASE_VERSION="${RELEASE_VERSION#desktop-wails-v}"
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash scripts/publish-desktop-wails.sh darwin-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-wails-darwin-aarch64
          path: dist-desktop-wails/darwin-aarch64/
          if-no-files-found: error

  windows:
    # 两个 Windows 目标:升级产物是**同一个单 exe zip**,arm64 需要 arm runner(托管镜像
    # windows-11-arm)。NSIS 安装包只在 x86_64 上做(x86 安装器在 arm64 上靠系统模拟运行)。
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: windows-x86_64
            runner: windows-latest
          # 清单键必须是 windows-aarch64(壳侧 platformKey():GOOS-<归一化 arch>),
          # 写成 windows-arm64 时 arm64 客户端永远查不到自己的产物。
          - plat: windows-aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    env:
      GAH_DESKTOP_URL_BASE: https://github.com/nekoleamo/go-agent-harness/releases/download/${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-src/package-lock.json
      - name: 外部插件与前端产物(go:embed 前置)
        shell: bash
        run: |
          bash scripts/gen-extplugins.sh
          bash scripts/gen-web.sh
      - name: 装 NSIS(仅 x86_64 需要)
        if: matrix.plat == 'windows-x86_64'
        shell: powershell
        # choco 装完**不会**刷新当前 runner 进程的 PATH ⇒ 同 job 后续步骤里 `command -v makensis`
        # 仍然失败(2026-10-30 实测:产物里静默少了 setup.exe,直到 merge job 的
        # fail_on_unmatched_files 才报红)。所以显式写进 GITHUB_PATH。
        run: |
          choco install nsis --no-progress -y
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: 构建 + 打包 + 签名 + 清单
        shell: bash
        env:
          GAH_DESKTOP_UPDATE_KEY: ${{ secrets.GAH_DESKTOP_UPDATE_KEY }}
          GAH_DESKTOP_UPDATE_PUBKEY: ${{ secrets.GAH_DESKTOP_UPDATE_PUBKEY }}
          # 补发路径(workflow_dispatch)没有 head_commit ⇒ 退回到「gah <tag>」,不让清单里的说明空着。
          RELEASE_NOTES: ${{ github.event.head_commit.message || format('gah {0}', inputs.tag || github.ref_name) }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
          # 发行路径上缺 makensis = 少一个首装包,**必须红**而不是静默跳过
          # (x86_64 才要求;arm64 按设计不产安装器)。
          GAH_DESKTOP_REQUIRE_NSIS: ${{ matrix.plat == 'windows-x86_64' && '1' || '' }}
        run: |
          umask 077
          printf '%s\n' "$GAH_DESKTOP_UPDATE_KEY" > "$RUNNER_TEMP/update.key"
          export GAH_DESKTOP_UPDATE_KEY="$RUNNER_TEMP/update.key"
          export RELEASE_VERSION="${RELEASE_VERSION#desktop-wails-v}"
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash scripts/publish-desktop-wails.sh ${{ matrix.plat }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-wails-${{ matrix.plat }}
          path: dist-desktop-wails/${{ matrix.plat }}/
          if-no-files-found: error

  merge-and-publish:
    needs: [darwin-aarch64, windows]
    runs-on: ubuntu-latest
    # 补发路径也要走到这里:workflow_dispatch(带 tag 输入)时 github.ref 是分支,
    # 只看 refs/tags/ 会把「三个阶段都成功、却永远不上传」做成一个静默缺口。
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: dist-desktop-wails
          pattern: desktop-wails-*
      - name: 摊平目录结构
        run: |
          set -euo pipefail
          mkdir -p /tmp/flat
          for d in dist-desktop-wails/desktop-wails-*; do
            plat="${d#dist-desktop-wails/desktop-wails-}"
            mkdir -p "dist-desktop-wails/$plat"
            cp -f "$d"/* "dist-desktop-wails/$plat"/
          done
          rm -rf dist-desktop-wails/desktop-wails-*
      - name: 合并清单 + 校验和
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          export RELEASE_VERSION="${RELEASE_VERSION#desktop-wails-v}"
          export RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash scripts/publish-desktop-wails.sh merge
      - name: 上传到 Release(升级包 / 首装包 / 清单 / 校验和)
        uses: softprops/action-gh-release@v2
        with:
          # tag 必须显式给:补发(workflow_dispatch)时 github.ref 是**分支**,
          # action 会报「GitHub Releases requires a tag」并整步失败(2026-10-30 实测)。
          tag_name: ${{ inputs.tag || github.ref_name }}
          # 预发布标记跟 tag 走(semver 带后缀 = prerelease):goreleaser 默认就是 auto,
          # 两边对同一个 Release 的说法要一致。
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist-desktop-wails/desktop-latest.json
            dist-desktop-wails/checksums-desktop-wails.txt
            dist-desktop-wails/*/*.zip
            dist-desktop-wails/*/*setup.exe
          fail_on_unmatched_files: true
      - name: 上传 dmg(可选;首装便利包,不进更新清单)
        # 单独一步 + 不强制匹配:hdiutil 失败时 package 脚本只告警,这里也不该因此整版变红。
        if: ${{ hashFiles('dist-desktop-wails/*/*.dmg') != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist-desktop-wails/*/*.dmg

  # 说明(与 Tauri 链同一口径):CI 不往 Gitee 传附件 —— 海外 runner 往 Gitee 传 25MB 级
  # 附件实测 60 秒 0 字节超时。Gitee 镜像由 scripts/mirror-gitee.sh 在本机跑。
